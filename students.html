<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - Student Management System</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">SM</span>
      <span class="brand-name">Student Manager</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="students.html" class="active">Students</a>
      <a href="student-add.html" class="admin-only">Add Student</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <span class="user-avatar js-user-avatar"></span>
        <div class="user-meta">
          <span class="user-name js-user-name"></span>
          <span class="user-role js-user-role"></span>
        </div>
      </div>
      <a href="#" class="logout-link" id="logoutBtn">Log out</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Students</h1>
        <p id="resultCount">Loading...</p>
      </div>
      <a href="student-add.html" class="btn btn-accent admin-only">+ Add student</a>
    </div>

    <div class="panel">
      <form class="toolbar" id="searchForm">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search by name, email or course...">
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
        <button type="button" class="btn btn-ghost" id="clearBtn" style="display:none;">Clear</button>
      </form>

      <div id="tableWrap">
        <p class="empty-state">Loading students...</p>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script>
  let currentPage = 1;
  let currentSearch = "";

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  async function loadStudents() {
    const wrap = document.getElementById("tableWrap");
    wrap.innerHTML = '<p class="empty-state">Loading students...</p>';

    try {
      const params = new URLSearchParams({ page: currentPage, search: currentSearch });
      const data = await apiFetch("api/students/list.php?" + params.toString());

      document.getElementById("resultCount").textContent =
        data.total + (data.total === 1 ? " record found." : " records found.");

      if (data.students.length === 0) {
        wrap.innerHTML = '<p class="empty-state">No students match your search.</p>';
        document.getElementById("pagination").innerHTML = "";
        return;
      }

      const isAdmin = window.currentUser.role === "admin";
      let html = `<table id="studentsTable"><thead><tr>
        <th>Name</th><th>Email</th><th>Phone</th><th>Course</th><th>Status</th><th>Actions</th>
      </tr></thead><tbody>`;

      data.students.forEach((s) => {
        html += `<tr>
          <td data-label="Name">${escapeHtml(s.full_name)}</td>
          <td data-label="Email">${escapeHtml(s.email)}</td>
          <td data-label="Phone">${escapeHtml(s.phone || "—")}</td>
          <td data-label="Course">${escapeHtml(s.course || "—")}</td>
          <td data-label="Status"><span class="badge badge-${s.status}">${s.status === "active" ? "Active" : "Inactive"}</span></td>
          <td data-label="Actions">
            <a href="student-view.html?id=${s.id}">View</a>
            ${isAdmin ? `&nbsp;|&nbsp;<a href="student-edit.html?id=${s.id}">Edit</a>
            &nbsp;|&nbsp;<a href="#" class="delete-link" data-id="${s.id}" style="color:var(--danger);">Delete</a>` : ""}
          </td>
        </tr>`;
      });
      html += "</tbody></table>";
      wrap.innerHTML = html;

      // wire up delete links
      wrap.querySelectorAll(".delete-link").forEach((link) => {
        link.addEventListener("click", async (e) => {
          e.preventDefault();
          if (!confirm("Are you sure you want to delete this student record? This cannot be undone.")) return;
          try {
            await apiFetch("api/students/delete.php?id=" + link.dataset.id, { method: "POST" });
            loadStudents();
          } catch (err) {
            alert("Could not delete: " + err.message);
          }
        });
      });

      // pagination
      const pag = document.getElementById("pagination");
      pag.innerHTML = "";
      for (let i = 1; i <= data.total_pages; i++) {
        const el = document.createElement(i === data.page ? "span" : "a");
        el.textContent = i;
        if (i === data.page) {
          el.className = "current";
        } else {
          el.addEventListener("click", () => {
            currentPage = i;
            loadStudents();
          });
        }
        pag.appendChild(el);
      }
    } catch (err) {
      wrap.innerHTML = '<p class="empty-state">Could not load students: ' + escapeHtml(err.message) + "</p>";
    }
  }

  document.getElementById("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    currentSearch = document.getElementById("searchInput").value.trim();
    currentPage = 1;
    document.getElementById("clearBtn").style.display = currentSearch ? "" : "none";
    loadStudents();
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    document.getElementById("searchInput").value = "";
    currentSearch = "";
    currentPage = 1;
    this.style.display = "none";
    loadStudents();
  });

  document.addEventListener("user-ready", loadStudents);
</script>
</body>
</html>
